<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lärmampel</title>
<link rel="stylesheet" href="style.css?v=4">
<script src="js/icons.js?v=4"></script>
<script src="js/theme.js?v=4"></script>
<script src="js/auth.js?v=4"></script>
</head>
<body class="popup-body">
  <div class="popup-ampel">
    <div class="traffic-light compact">
      <div class="light red" id="light-red"></div>
      <div class="light yellow" id="light-yellow"></div>
      <div class="light green" id="light-green"></div>
    </div>
    <div class="db-display small"><span id="db-value">–</span><span class="db-unit">dB</span></div>
    <div class="popup-alarm-count hint" data-icon="alert">Rotfärbungen:&nbsp;<strong id="alarm-count">0</strong></div>
    <button id="btn-mic" class="primary small" data-icon="mic">Start</button>
  </div>
<script src="js/noise.js?v=4"></script>
<script>
  const meter = new NoiseMeter({
    dbEl: document.getElementById('db-value'),
    alarmCountEl: document.getElementById('alarm-count'),
    lights: {
      red: document.getElementById('light-red'),
      yellow: document.getElementById('light-yellow'),
      green: document.getElementById('light-green'),
    },
  });
  const btn = document.getElementById('btn-mic');
  btn.addEventListener('click', async () => {
    if (meter.running) { meter.stop(); btn.innerHTML = Icons.raw('mic') + 'Start'; }
    else {
      try { await meter.start(); btn.innerHTML = Icons.raw('stop') + 'Stopp'; }
      catch (e) { alert('Mikrofon-Zugriff nicht möglich: ' + e.message); }
    }
  });
  // Grenzwert live übernehmen, wenn er im Hauptfenster geändert wird
  window.addEventListener('storage', () => meter.reloadThreshold());
  // Laufende Messung zählt als Nutzung – die Ampel soll sich im Unterricht nicht sperren
  setInterval(() => { if (meter.running) { Auth._lastWrite = 0; Auth.touch(); } }, 60000);
</script>
</body>
</html>
