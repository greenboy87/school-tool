<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ex</title>
<link rel="stylesheet" href="style.css?v=225">
<link rel="stylesheet" href="ex.css?v=225">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23a855f7%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z%22/></svg>">
<script src="js/icons.js?v=225"></script>
<script src="js/theme.js?v=225"></script>
<script src="js/firebase-config.js?v=225"></script>
<script type="module" src="js/live-firebase.js?v=225"></script>
</head>
<body class="ex-seite">

<!-- Kopfzeile: Klasse und Ex links, Code rechts – zeigt auf geteilten iPads sofort, wo man ist -->
<header class="ex-kopfzeile" id="ex-kopfzeile" hidden>
  <span id="ex-kopf-titel"></span>
  <span class="ex-kopf-code" id="ex-kopf-code"></span>
</header>

<main class="ex-huelle">

  <!-- Verbinden / Laden -->
  <section id="s-laden" class="ex-karte ex-mitte">
    <p id="s-laden-text">Verbinde …</p>
  </section>

  <!-- Code eingeben (ohne QR-Code geöffnet) -->
  <section id="s-code" class="ex-karte ex-mitte" hidden>
    <h1>Ex beitreten</h1>
    <p class="hint">Gib den Code von der Leinwand ein.</p>
    <form id="code-form" class="ex-code-form">
      <input id="code-feld" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off"
             placeholder="000000" aria-label="Code">
      <button type="submit" class="primary">Weiter</button>
    </form>
    <p id="code-fehler" class="ex-fehler" role="alert"></p>
  </section>

  <!-- Nummer wählen -->
  <section id="s-nummer" class="ex-karte" hidden>
    <h1 id="nummer-titel">Wer bist du?</h1>
    <p class="hint" id="nummer-hint">Tippe deinen Namen an.</p>
    <div id="nummern" class="ex-nummern"></div>
    <label class="ex-notenschutz">
      <input type="checkbox" id="notenschutz-schalter" role="switch">
      <span class="schalter-bahn" aria-hidden="true"></span>
      <span>Ich habe Notenschutz (Legasthenie/LRS)</span>
    </label>
    <p class="hint ex-notenschutz-hint">Deine Lehrkraft bestätigt das noch.</p>
    <label class="ex-test-name" id="test-name-feld" hidden>Dein Name
      <input type="text" id="test-name" maxlength="30" autocomplete="off" autocapitalize="words" placeholder="z. B. Mia">
    </label>
    <button id="btn-beitreten" class="primary ex-gross" disabled>Weiter</button>
    <p id="nummer-fehler" class="ex-fehler" role="alert"></p>
  </section>

  <!-- Warteraum -->
  <section id="s-warten" class="ex-karte ex-mitte" hidden>
    <div class="ex-nr-gross" id="warten-nr"></div>
    <div class="ex-warten-name" id="warten-name"></div>
    <h1>Warte auf Freigabe</h1>
    <p class="hint" id="warten-text">Deine Lehrkraft gibt dich gleich frei. Lass diese Seite offen.</p>
    <p class="hint" id="warten-ns"></p>
    <button id="btn-andere-nummer" class="small">Andere Nummer wählen</button>
  </section>

  <!-- Hinweis- und Endschirme -->
  <section id="s-meldung" class="ex-karte ex-mitte" hidden>
    <h1 id="meldung-titel"></h1>
    <p class="hint" id="meldung-text"></p>
  </section>

</main>

<!-- Die Ex selbst: Vollbild, abgeschottet (kein allow-same-origin) -->
<div id="ex-rahmen" class="ex-rahmen" hidden></div>

<script src="js/ex-namen.js?v=225"></script>
<script src="js/ex-schueler.js?v=225"></script>
</body>
</html>
